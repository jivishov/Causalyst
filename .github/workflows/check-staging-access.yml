name: Check staging access

on:
  push:
    branches: [feat/temporary-assignments]
    paths: [.github/workflows/check-staging-access.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-access-check
  cancel-in-progress: true

jobs:
  inspect:
    if: github.repository == 'jivishov/Causalyst' && github.ref == 'refs/heads/feat/temporary-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check existing deployment credentials without changing resources
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs';
          const account = '5e7d70106d7f974d0854f4ff15e4a12e';
          const project = 'nscgqhsfudbnzfayvrnl';
          const origin = 'https://staging.explain.az';
          const report = {
            cloudflareTokenConfigured: Boolean(process.env.CF_TOKEN),
            cloudflareAccountMatches: process.env.CF_ACCOUNT === account,
            supabaseManagementTokenConfigured: Boolean(process.env.SB_TOKEN),
          };
          async function read(url, token) {
            try {
              const response = await fetch(url, {
                method: 'GET',
                redirect: 'error',
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                signal: AbortSignal.timeout(30000),
              });
              return { status: response.status, data: response.ok ? await response.json() : null };
            } catch {
              return { status: 0, data: null };
            }
          }
          const checks = [];
          if (report.cloudflareTokenConfigured && report.cloudflareAccountMatches) {
            checks.push((async () => {
              const result = await read('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts', process.env.CF_TOKEN);
              report.cloudflareReadStatus = result.status;
              report.stagingWorkerExists = result.data?.success === true && Array.isArray(result.data.result)
                ? result.data.result.some(worker => worker.id === 'explain-staging') : null;
            })());
          }
          if (report.supabaseManagementTokenConfigured) {
            checks.push((async () => {
              const result = await read('https://api.supabase.com/v1/projects/' + project + '/config/auth', process.env.SB_TOKEN);
              report.supabaseAuthReadStatus = result.status;
              if (result.status === 200 && result.data) {
                const auth = result.data;
                report.siteUrlMatches = auth.site_url === origin;
                report.frontendCallbackAllowed = String(auth.uri_allow_list || '').split(',').map(value => value.trim()).includes(origin + '/auth/callback');
                report.googleEnabled = auth.external_google_enabled === true;
                report.googleCredentialsConfigured = Boolean(auth.external_google_client_id && auth.external_google_secret);
                report.oauthServerEnabled = auth.oauth_server_enabled === true;
                report.oauthAuthorizationPathMatches = auth.oauth_server_authorization_path === '/teacher/chatgpt-plugin';
              }
            })());
            checks.push((async () => {
              const result = await read('https://api.supabase.com/v1/projects/' + project + '/api-keys?reveal=false', process.env.SB_TOKEN);
              report.supabaseKeyMetadataReadStatus = result.status;
              report.stagingServiceKeyMetadataPresent = result.status === 200 && Array.isArray(result.data)
                ? result.data.some(key => key.disabled !== true && (key.name === 'service_role' || key.type === 'secret')) : null;
            })());
          }
          const outcomes = await Promise.allSettled(checks);
          report.readChecksCompleted = outcomes.every(result => result.status === 'fulfilled');
          const summary = JSON.stringify(report, null, 2);
          console.log('STAGING_ACCESS_REPORT=' + summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Read-only staging access check. Only presence flags, exact-target comparisons and HTTP status codes are included.\n\n~~~json\n' + summary + '\n~~~\n');
          if (!report.cloudflareTokenConfigured || !report.cloudflareAccountMatches ||
              !report.supabaseManagementTokenConfigured || report.cloudflareReadStatus !== 200 ||
              report.supabaseAuthReadStatus !== 200 || report.supabaseKeyMetadataReadStatus !== 200 ||
              !report.readChecksCompleted) {
            process.exitCode = 1;
          }
          NODE
