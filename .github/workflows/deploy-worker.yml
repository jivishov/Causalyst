name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: "All committed database migrations are applied and staging release gates have passed"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed main branch and completed database preparation
        env:
          RELEASE_REF: ${{ github.ref }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
        run: |
          test "$RELEASE_REF" = "refs/heads/main"
          test "$MIGRATIONS_APPLIED" = "true"

  validate:
    needs: release-gate
    uses: ./.github/workflows/validate.yml

  test-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        run: node scripts/validate-deploy-env.mjs worker
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.136.1"
          command: >-
            deploy
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_JWKS_URL:${{ vars.SUPABASE_JWKS_URL }}
            --var APP_ENV:${{ vars.APP_ENV }}
            --var ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY
            PIN_PEPPER
            TEACHER_SETUP_CODE
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
      - name: Verify deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          FRONTEND_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          node scripts/validate-worker-url.mjs "$WORKER_URL"
          node scripts/validate-worker-url.mjs "$FRONTEND_WORKER_URL"
          if [ "$WORKER_URL" != "$FRONTEND_WORKER_URL" ]; then
            echo "VITE_WORKER_URL does not match the deployed Worker URL."
            exit 1
          fi
          node - <<'NODE'
          const response = await fetch(`${process.env.WORKER_URL}/api/health`);
          const payload = await response.json();
          if (!response.ok || payload?.ok !== true) {
            throw new Error(`Worker health check failed with HTTP ${response.status}`);
          }
          console.log("Worker health check passed.");
          NODE

  deploy-frontend:
    needs: test-and-deploy
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
