name: Prepare explain.az domain

on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-explain-domain.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explain-domain-setup
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare and prepare the domain zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          const token = process.env.CF_TOKEN;
          const accountId = process.env.CF_ACCOUNT;
          if (!token || !accountId) throw new Error("The existing Cloudflare deployment credentials are unavailable.");
          async function cf(path, method = "GET", body) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              method,
              headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              const errors = (data.errors || []).map(error => ({ code: error.code, message: error.message }));
              throw new Error("Cloudflare " + method + " " + path.split("?")[0] + " failed: HTTP " + response.status + " " + JSON.stringify(errors));
            }
            return data.result;
          }
          for (const name of ["virtuallab.az", "explain.az"]) {
            const response = await fetch("https://dns.google/resolve?name=" + name + "&type=NS");
            const dns = await response.json();
            console.log("Public nameservers:", JSON.stringify({ domain: name, status: dns.Status, nameservers: (dns.Answer || []).filter(item => item.type === 2).map(item => item.data) }));
          }
          const existing = await cf("/zones?name=virtuallab.az&account.id=" + encodeURIComponent(accountId));
          if (existing.length !== 1 || existing[0].account?.id !== accountId) {
            throw new Error("The deployment token cannot verify virtuallab.az in this account. No domain settings have been changed; access to that zone is required.");
          }
          console.log("Verified existing zone:", JSON.stringify({ name: existing[0].name, status: existing[0].status, nameservers: existing[0].name_servers }));
          const records = await cf("/zones/" + existing[0].id + "/dns_records?per_page=100");
          console.log("Existing Virtual Lab web records:", JSON.stringify(records.filter(record => ["A", "AAAA", "CNAME"].includes(record.type) && [existing[0].name, "www." + existing[0].name].includes(record.name)).map(({ type, name, content, proxied }) => ({ type, name, content, proxied }))));
          const matches = await cf("/zones?name=explain.az&account.id=" + encodeURIComponent(accountId));
          if (matches.length > 1) throw new Error("Multiple explain.az zones found; no changes made.");
          const zone = matches[0] || await cf("/zones", "POST", { name: "explain.az", account: { id: accountId }, type: "full" });
          if (zone.account?.id !== accountId) throw new Error("The explain.az zone belongs to a different account.");
          console.log("EXPLAIN_AZ_ZONE:", JSON.stringify({ name: zone.name, status: zone.status, nameservers: zone.name_servers }));
          const staged = await cf("/zones/" + zone.id + "/dns_records?per_page=100");
          console.log("Existing explain.az web records:", JSON.stringify(staged.filter(record => ["A", "AAAA", "CNAME"].includes(record.type)).map(({ type, name, content, proxied }) => ({ type, name, content, proxied }))));
          console.log("Domain zone preparation completed. The current website and Virtual Lab configuration were not changed.");
          NODE
