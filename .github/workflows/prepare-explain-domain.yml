name: Prepare explain.az domain

on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-explain-domain.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: explain-domain-setup
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare and prepare the domain zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SB_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_URL: ${{ vars.SUPABASE_URL }}
        run: |
          node --input-type=module - <<'NODE'
          const token = process.env.CF_TOKEN;
          const accountId = process.env.CF_ACCOUNT;
          if (!token || !accountId) throw new Error("The existing Cloudflare deployment credentials are unavailable.");
          async function cf(path, method = "GET", body) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              method,
              headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              const errors = (data.errors || []).map(error => ({ code: error.code, message: error.message }));
              throw new Error("Cloudflare " + method + " " + path.split("?")[0] + " failed: HTTP " + response.status + " " + JSON.stringify(errors));
            }
            return data.result;
          }
          for (const name of ["virtuallab.az", "explain.az"]) {
            const response = await fetch("https://dns.google/resolve?name=" + name + "&type=NS");
            const dns = await response.json();
            console.log("Public nameservers:", JSON.stringify({ domain: name, status: dns.Status, nameservers: (dns.Answer || []).filter(item => item.type === 2).map(item => item.data) }));
          }
          const existing = await cf("/zones?name=virtuallab.az&account.id=" + encodeURIComponent(accountId));
          if (existing.length !== 1 || existing[0].account?.id !== accountId) {
            throw new Error("The deployment token cannot verify virtuallab.az in this account. No domain settings have been changed; access to that zone is required.");
          }
          console.log("Verified existing zone:", JSON.stringify({ name: existing[0].name, status: existing[0].status, nameservers: existing[0].name_servers }));
          try {
            const records = await cf("/zones/" + existing[0].id + "/dns_records?per_page=100");
            console.log("Existing Virtual Lab web records:", JSON.stringify(records.filter(record => ["A", "AAAA", "CNAME"].includes(record.type) && [existing[0].name, "www." + existing[0].name].includes(record.name)).map(({ type, name, content, proxied }) => ({ type, name, content, proxied }))));
          } catch (error) {
            console.log("Virtual Lab DNS inspection unavailable:", error.message);
          }
          const matches = await cf("/zones?name=explain.az&account.id=" + encodeURIComponent(accountId));
          if (matches.length > 1) throw new Error("Multiple explain.az zones found; no changes made.");
          const zone = matches[0] || await cf("/zones", "POST", { name: "explain.az", account: { id: accountId }, type: "full" });
          if (zone.account?.id !== accountId) throw new Error("The explain.az zone belongs to a different account.");
          console.log("EXPLAIN_AZ_ZONE:", JSON.stringify({ name: zone.name, status: zone.status, nameservers: zone.name_servers }));
          const staged = await cf("/zones/" + zone.id + "/dns_records?per_page=100");
          console.log("Existing explain.az web records:", JSON.stringify(staged.filter(record => ["A", "AAAA", "CNAME"].includes(record.type)).map(({ type, name, content, proxied }) => ({ type, name, content, proxied }))));
          const expected = [
            ...["185.199.108.153", "185.199.109.153", "185.199.110.153", "185.199.111.153"].map(content => ({ type: "A", name: "explain.az", content, ttl: 1, proxied: false })),
            { type: "CNAME", name: "www.explain.az", content: "jivishov.github.io", ttl: 1, proxied: false }
          ];
          const webNames = new Set(expected.map(record => record.name));
          for (const record of staged.filter(record => webNames.has(record.name) && ["A", "AAAA", "CNAME"].includes(record.type))) {
            if (!expected.some(target => target.name === record.name && target.type === record.type && target.content === record.content.replace(/\.$/, ""))) {
              throw new Error("An unexpected existing web record needs review before changing DNS: " + record.name + " " + record.type);
            }
          }
          for (const record of expected) {
            const match = staged.find(item => item.name === record.name && item.type === record.type && item.content.replace(/\.$/, "") === record.content);
            if (!match) await cf("/zones/" + zone.id + "/dns_records", "POST", record);
            else if (match.proxied || match.ttl !== 1) await cf("/zones/" + zone.id + "/dns_records/" + match.id, "PATCH", record);
          }
          const verified = await cf("/zones/" + zone.id + "/dns_records?per_page=100");
          for (const target of expected) {
            if (!verified.some(record => record.name === target.name && record.type === target.type && record.content.replace(/\.$/, "") === target.content && record.proxied === false)) {
              throw new Error("The required DNS record could not be verified: " + target.name + " " + target.type);
            }
          }
          console.log("EXPLAIN_AZ_DNS_READY:", JSON.stringify(expected));
          const pagesResponse = await fetch("https://api.github.com/repos/jivishov/Causalyst/pages", {
            headers: { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }
          });
          if (!pagesResponse.ok) throw new Error("Could not inspect GitHub Pages configuration: HTTP " + pagesResponse.status);
          const pages = await pagesResponse.json();
          console.log("GITHUB_PAGES_CONFIGURATION:", JSON.stringify({ cname: pages.cname, html_url: pages.html_url, build_type: pages.build_type, https_enforced: pages.https_enforced }));
          const callbacks = [
            "https://explain.az/login",
            "https://explain.az/teacher",
            "https://explain.az/teacher/reset-password",
            "https://explain.az/auth/callback"
          ];
          if (process.env.SB_ACCESS_TOKEN) {
            const ref = new URL(process.env.SB_URL).hostname.split(".")[0];
            if (ref !== "bpqckntsnattswwzmroq") throw new Error("The Supabase project does not match Causalyst.");
            const authEndpoint = "https://api.supabase.com/v1/projects/" + ref + "/config/auth";
            const authHeaders = { Authorization: "Bearer " + process.env.SB_ACCESS_TOKEN, "Content-Type": "application/json" };
            const authResponse = await fetch(authEndpoint, { headers: authHeaders });
            if (!authResponse.ok) throw new Error("Could not inspect the Supabase redirect allowlist: HTTP " + authResponse.status);
            const auth = await authResponse.json();
            const allowlist = [...new Set([...(auth.uri_allow_list || "").split(",").map(value => value.trim()).filter(Boolean), ...callbacks])];
            const updated = await fetch(authEndpoint, { method: "PATCH", headers: authHeaders, body: JSON.stringify({ uri_allow_list: allowlist.join(",") }) });
            if (!updated.ok) throw new Error("Could not update the Supabase redirect allowlist: HTTP " + updated.status);
            const result = await (await fetch(authEndpoint, { headers: authHeaders })).json();
            if (!callbacks.every(url => (result.uri_allow_list || "").split(",").includes(url))) throw new Error("Supabase callback verification failed.");
            console.log("EXPLAIN_AZ_LOGIN_REDIRECTS_READY:", JSON.stringify(callbacks));
          } else {
            console.log("SUPABASE_MANUAL_REDIRECT_CONFIGURATION_REQUIRED:", JSON.stringify(callbacks));
          }
          console.log("Cloudflare DNS is staged. Activate the GitHub custom domain and registrar nameservers after login redirects are configured.");

          NODE
