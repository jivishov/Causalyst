name: Prepare Causalyst for explain.az

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-explain-domain.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the unchanged deployed backend and authentication code
        env:
          BACKEND_SHA: 05c2987e97590edd005756ce8907b363fc25d978
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git diff --quiet "$BACKEND_SHA" "$GITHUB_SHA" -- worker shared supabase package.json package-lock.json scripts frontend/src/auth

  test-and-deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - name: Verify the root-domain asset paths
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, existsSync } from "node:fs";
          import { join } from "node:path";
          const html = readFileSync("frontend/dist/index.html", "utf8");
          const assets = [...html.matchAll(/(?:src|href)=["']([^"']+[.](?:js|css))["']/g)].map(match => match[1]);
          if (!assets.length || !assets.every(path => path.startsWith("/assets/") && existsSync(join("frontend/dist", path.slice(1))))) {
            throw new Error("The domain root build has invalid asset paths.");
          }
          console.log("Root-domain build verified:", assets.length, "entry assets.");
          NODE
      - run: npm run security
      - name: Validate deployment configuration
        run: node scripts/validate-deploy-env.mjs worker
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          ALLOWED_ORIGINS: ${{ format('{0},https://explain.az,https://www.explain.az', vars.ALLOWED_ORIGINS) }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.145.0"
          command: >-
            deploy
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_JWKS_URL:${{ vars.SUPABASE_JWKS_URL }}
            --var APP_ENV:${{ vars.APP_ENV }}
            --var ALLOWED_ORIGINS:${{ format('{0},https://explain.az,https://www.explain.az', vars.ALLOWED_ORIGINS) }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY
            PIN_PEPPER
            TEACHER_SETUP_CODE
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
      - name: Verify deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          FRONTEND_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          node scripts/validate-worker-url.mjs "$WORKER_URL"
          node scripts/validate-worker-url.mjs "$FRONTEND_WORKER_URL"
          if [ "$WORKER_URL" != "$FRONTEND_WORKER_URL" ]; then
            echo "VITE_WORKER_URL does not match the deployed Worker URL."
            exit 1
          fi
          node - <<'NODE'
          const response = await fetch(`${process.env.WORKER_URL}/api/health`);
          const payload = await response.json();
          if (!response.ok || payload?.ok !== true) {
            throw new Error(`Worker health check failed with HTTP ${response.status}`);
          }
          for (const origin of ["https://explain.az", "https://www.explain.az"]) {
            let verified = false;
            for (let attempt = 0; attempt < 8; attempt++) {
              const preflight = await fetch(process.env.WORKER_URL + "/api/student/me", {
                method: "OPTIONS",
                headers: { Origin: origin, "Access-Control-Request-Method": "GET", "Access-Control-Request-Headers": "authorization,content-type" }
              });
              if (preflight.status === 204 && preflight.headers.get("access-control-allow-origin") === origin) {
                verified = true;
                break;
              }
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 1500));
            }
            if (!verified) throw new Error("API origin verification failed for " + origin);
          }
          console.log("Worker health and both explain.az API origins verified.");
          NODE

  deploy-frontend:
    needs: test-and-deploy
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
