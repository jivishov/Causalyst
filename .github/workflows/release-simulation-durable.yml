name: Release durable simulation generation

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-simulation-durable.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the reviewed code and unchanged database schema
        env:
          REVIEWED_SHA: 8a4eed098c69f85ad9fb75e735a43e7630ce3e43
          BACKEND_SHA: 137c81c5b2617880eda908c6d2a2d8bb5cc02d42
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git diff --name-only "$REVIEWED_SHA" "$GITHUB_SHA")" = ".github/workflows/release-simulation-durable.yml"
          git diff --quiet "$BACKEND_SHA" "$REVIEWED_SHA" -- package.json package-lock.json supabase worker/src/lib/database.generated.ts frontend/src/auth .github/workflows/deploy-frontend.yml
      - name: Verify full validation and the production backend baseline
        uses: actions/github-script@v8
        with:
          script: |
            const checked = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37040393072 });
            if (checked.data.head_sha !== "8a4eed098c69f85ad9fb75e735a43e7630ce3e43" || checked.data.status !== "completed" || checked.data.conclusion !== "success") {
              throw new Error("Full validation has not passed for the reviewed code.");
            }
            const deployed = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37023265111 });
            if (deployed.data.head_sha !== "137c81c5b2617880eda908c6d2a2d8bb5cc02d42" || deployed.data.status !== "completed" || deployed.data.conclusion !== "success") {
              throw new Error("The production backend baseline is not verified.");
            }
      - name: Verify prepared production job storage without reading student records
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node - <<'NODE'
          if (new URL(process.env.SUPABASE_URL).hostname !== "bpqckntsnattswwzmroq.supabase.co") {
            throw new Error("The production database does not match this release.");
          }
          const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/simulation_generation_jobs?select=status,provider_status,provider_response_id,service_tier_requested,service_tier_used&limit=0`, {
            headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}` }
          });
          if (!response.ok || (await response.json()).length !== 0) {
            throw new Error("Simulation job storage is unavailable.");
          }
          console.log("Production job storage verified.");
          NODE

  test-and-deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        run: node scripts/validate-deploy-env.mjs worker
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.145.0"
          command: >-
            deploy
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_JWKS_URL:${{ vars.SUPABASE_JWKS_URL }}
            --var APP_ENV:${{ vars.APP_ENV }}
            --var ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY
            PIN_PEPPER
            TEACHER_SETUP_CODE
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
      - name: Verify deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          FRONTEND_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          node scripts/validate-worker-url.mjs "$WORKER_URL"
          node scripts/validate-worker-url.mjs "$FRONTEND_WORKER_URL"
          if [ "$WORKER_URL" != "$FRONTEND_WORKER_URL" ]; then
            echo "VITE_WORKER_URL does not match the deployed Worker URL."
            exit 1
          fi
          node - <<'NODE'
          const response = await fetch(`${process.env.WORKER_URL}/api/health`);
          const payload = await response.json();
          if (!response.ok || payload?.ok !== true) {
            throw new Error(`Worker health check failed with HTTP ${response.status}`);
          }
          console.log("Worker health check passed.");
          NODE

  deploy-frontend:
    needs: test-and-deploy
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
