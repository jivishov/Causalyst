name: Release student sidebar and drafts

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-student-history.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: student-interface-release
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify reviewed source and unchanged backend
        env:
          REVIEWED_SHA: d675f69295870680be97c2d06f54d244a39cc4bc
          PREVIOUS_RELEASE_SHA: 1da0f88382fd131ba50bac46d3e5ff3259453722
        run: |
          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const files = execFileSync("git", ["diff", "--name-only", process.env.REVIEWED_SHA, process.env.GITHUB_SHA], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          if (files.some(file => file !== ".github/workflows/release-student-history.yml")) {
            throw new Error("The release contains source changes beyond the reviewed commit.");
          }
          execFileSync("git", ["diff", "--exit-code", process.env.PREVIOUS_RELEASE_SHA, process.env.GITHUB_SHA, "--",
            "worker/src", "shared/src", "supabase", "frontend/src/auth", "package.json", "package-lock.json", "worker/wrangler.toml"], { stdio: "inherit" });
          NODE
      - name: Require successful browser and real database validation
        uses: actions/github-script@v8
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37348034630 });
            if (run.head_sha !== "d675f69295870680be97c2d06f54d244a39cc4bc" || run.status !== "completed" || run.conclusion !== "success") {
              throw new Error("The reviewed source has not passed full validation.");
            }
            core.info("Reviewed source passed browser and real Supabase checks.");
  deploy-frontend:
    needs: release-gate
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
  verify-public:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - id: site
        name: Resolve the published site
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            if (!data.html_url?.startsWith("https://")) throw new Error("The published site URL is unavailable.");
            core.setOutput("url", data.html_url.endsWith("/") ? data.html_url : data.html_url + "/");
      - name: Verify class navigation and saved draft interface
        env:
          PUBLIC_URL: ${{ steps.site.outputs.url }}
          WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.PUBLIC_URL;
          const health = await fetch(process.env.WORKER_URL + "/api/health");
          if (!health.ok || (await health.json()).ok !== true) throw new Error("The existing backend is unavailable.");
          const history = await fetch(process.env.WORKER_URL + "/api/student/submissions");
          if (history.status !== 401) throw new Error("The saved history endpoint must require student sign-in.");
          let lastError;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const response = await fetch(base + "?view=work&release=" + process.env.GITHUB_SHA, { cache: "no-store" });
              if (!response.ok) throw new Error("The published site is unavailable.");
              const html = await response.text();
              const entryPath = html.match(/src=["']([^"']+\.js)["']/)?.[1];
              if (!entryPath) throw new Error("The app entry module is unavailable.");
              const entryUrl = new URL(entryPath, base);
              const entry = await fetch(entryUrl);
              if (!entry.ok) throw new Error("The app entry could not be loaded.");
              const code = await entry.text();
              if (!code.includes("student-course-nav") || code.includes("assigned-nav-link")) {
                throw new Error("The published sidebar still contains assignment navigation.");
              }
              const modulePath = code.match(/\bimport\(["']([^"']*Dashboard-[^"']+\.js)["']\)/)?.[1];
              if (!modulePath) throw new Error("The student dashboard module is unavailable.");
              const dashboard = await fetch(new URL(modulePath, entryUrl));
              if (!dashboard.ok) throw new Error("The student dashboard could not be loaded.");
              const dashboardCode = await dashboard.text();
              for (const marker of ["Search saved work", "In progress", "Continue draft", "saved drafts and submissions"]) {
                if (!dashboardCode.includes(marker)) throw new Error("The published My work interface is missing " + marker);
              }
              console.log("Published class-only sidebar and resumable drafts verified:", base);
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          throw lastError;
          NODE
