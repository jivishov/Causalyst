name: Release student preview recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-student-layout.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: student-layout-release
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the reviewed frontend and deployed backend
        env:
          REVIEWED_SHA: 80e93fd252122f676ca712b9391df8b7be255a1e
          BACKEND_SHA: 68580db7631e474b67fa3c008cbc2c95f41e2d6b
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git diff --name-only "$REVIEWED_SHA" "$GITHUB_SHA")" = ".github/workflows/release-student-layout.yml"
          git diff --quiet "$BACKEND_SHA" "$REVIEWED_SHA" -- worker shared supabase package.json package-lock.json scripts .github/workflows/deploy-frontend.yml
      - name: Verify successful validation and production backend release
        uses: actions/github-script@v8
        with:
          script: |
            const checked = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 36966927797 });
            const deployed = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 36965621174 });
            for (const [run, sha] of [
              [checked.data, "80e93fd252122f676ca712b9391df8b7be255a1e"],
              [deployed.data, "68580db7631e474b67fa3c008cbc2c95f41e2d6b"]
            ]) {
              if (run.head_sha !== sha || run.status !== "completed" || run.conclusion !== "success") {
                throw new Error("The reviewed checks or deployed backend do not match this release.");
              }
            }

  deploy-frontend:
    needs: release-gate
    uses: ./.github/workflows/deploy-frontend.yml
