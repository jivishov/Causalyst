name: Release corrected gas preview and Explain headline
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-teacher-frontpage.yml]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: causalyst-interface-release
  cancel-in-progress: false
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the validated frontend and deployed backend
        env:
          REVIEWED_SHA: 648a378ac829e2ceb8c95b642407376d49bab388
          BACKEND_SHA: 05c2987e97590edd005756ce8907b363fc25d978
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git diff --name-only "$REVIEWED_SHA" "$GITHUB_SHA")" = ".github/workflows/release-teacher-frontpage.yml"
          git diff --quiet "$BACKEND_SHA" "$REVIEWED_SHA" -- worker shared supabase package.json package-lock.json scripts .github/workflows/deploy-frontend.yml
      - name: Verify successful validation and production backend release
        uses: actions/github-script@v8
        with:
          script: |
            const checked = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37211399265 });
            const deployed = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37072085393 });
            for (const [run, sha] of [
              [checked.data, "648a378ac829e2ceb8c95b642407376d49bab388"],
              [deployed.data, "05c2987e97590edd005756ce8907b363fc25d978"]
            ]) {
              if (run.head_sha !== sha || run.status !== "completed" || run.conclusion !== "success") {
                throw new Error("Validation or the production backend does not match this release.");
              }
            }
  deploy-frontend:
    needs: release-gate
    uses: ./.github/workflows/deploy-frontend.yml
  verify-public:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify the published teacher interface and student frontpage
        run: |
          node --input-type=module - <<'NODE'
          const base = "https://jivishov.github.io/Causalyst/";
          const version = process.env.GITHUB_SHA;
          let lastError;
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const root = await fetch(base + "?release=" + version);
              if (!root.ok) throw new Error("Student frontpage returned HTTP " + root.status);
              const html = await root.text();
              if (!html.includes("Explain your thinking") || !html.includes("live conversation assessments")) {
                throw new Error("The published student frontpage metadata has not updated yet.");
              }
              const styles = [...html.matchAll(/href=["']([^"']+\.css)["']/g)].map(match => new URL(match[1], base).href);
              if (!styles.length) throw new Error("Interface stylesheet was not found.");
              const css = (await Promise.all(styles.map(async url => {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Stylesheet returned HTTP " + response.status);
                return response.text();
              }))).join("\n");
              for (const marker of ["teacher-design", "teacher-builder-tabs", "student-frontpage", "frontpage-format-tabs", "student-mobile-signout"]) {
                if (!css.includes(marker)) throw new Error("Published interface is missing " + marker);
              }
              if (!/\.frontpage-hero\s*\{[^}]*padding:\s*22px 0 20px/.test(css)) {
                throw new Error("The compact student frontpage spacing has not updated yet.");
              }
              const module = html.match(/src=["']([^"']+\.js)["']/)?.[1];
              if (!module) throw new Error("App entry module was not found.");
              const entryUrl = new URL(module, base);
              const entry = await fetch(entryUrl);
              if (!entry.ok) throw new Error("App entry module returned HTTP " + entry.status);
              const loginModule = (await entry.text()).match(/\bimport\(["']([^"']*Login-[^"']+\.js)["']\)/)?.[1];
              if (!loginModule) throw new Error("Student frontpage module was not found.");
              const frontpage = await fetch(new URL(loginModule, entryUrl));
              if (!frontpage.ok) throw new Error("Student frontpage module returned HTTP " + frontpage.status);
              const frontpageCode = await frontpage.text();
              for (const marker of ["Explain your thinking.", "In a simulation assessment, you answer by explaining the process.", "gas-cylinder", "gas-piston-rod", "gas-piston-handle", "Heat exchange keeps temperature constant."]) {
                if (!frontpageCode.includes(marker)) throw new Error("The revised frontpage is missing " + marker);
              }
              const fallback = await fetch(base + "404.html?release=" + version);
              if (!fallback.ok || !(await fallback.text()).includes("Explain your thinking")) {
                throw new Error("The app's deep-link fallback has not updated yet.");
              }
              console.log("Verified student frontpage:", base);
              console.log("Verified teacher interface styles and app routing:", base + "teacher/assessments");
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          throw lastError;
          NODE
