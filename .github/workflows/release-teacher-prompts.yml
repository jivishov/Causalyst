name: Release teacher prompt refinements

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-teacher-prompts.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the validated implementation
        env:
          REVIEWED_SHA: c5ee3150c11c5733fa812c878d5cfb342730c09b
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git diff --name-only "$REVIEWED_SHA" "$GITHUB_SHA")" = ".github/workflows/release-teacher-prompts.yml"
      - name: Verify full validation passed
        uses: actions/github-script@v8
        with:
          script: |
            const checked = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 37809940061 });
            if (checked.data.head_sha !== "c5ee3150c11c5733fa812c878d5cfb342730c09b" || checked.data.status !== "completed" || checked.data.conclusion !== "success") {
              throw new Error("Full validation has not passed for the reviewed implementation.");
            }
      - name: Verify prepared prompt storage and ownership checks without reading student records
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node - <<'NODE'
          if (new URL(process.env.SUPABASE_URL).hostname !== "bpqckntsnattswwzmroq.supabase.co") {
            throw new Error("The database does not match this release.");
          }
          const teacher = "00000000-0000-0000-0000-000000000000";
          const requests = [
            ["get_teacher_prompt_context", { p_teacher_id: teacher, p_type: "simulation", p_assessment_id: null, p_assignment_id: null }],
            ["set_teacher_ai_prompts", { p_teacher_id: teacher, p_scope: "defaults", p_scope_id: teacher, p_type: "simulation", p_prompts: {}, p_expected_updated_at: null }],
            ["save_teacher_resource_with_prompts", { p_teacher_id: teacher, p_scope: "assessment", p_resource_id: null, p_patch: {}, p_prompts: {}, p_expected_updated_at: null, p_expected_prompt_updated_at: null }]
          ];
          for (const [name, input] of requests) {
            for (const key of [process.env.SUPABASE_SERVICE_ROLE_KEY, process.env.SUPABASE_ANON_KEY]) {
              const response = await fetch(process.env.SUPABASE_URL + "/rest/v1/rpc/" + name, {
                method: "POST", headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" }, body: JSON.stringify(input)
              });
              const body = await response.json();
              const validStatus = key === process.env.SUPABASE_SERVICE_ROLE_KEY ? response.status === 403 : [401, 403].includes(response.status);
              if (!validStatus || body.code !== "42501") throw new Error("Prompt migration or access checks are unavailable: " + name);
            }
          }
          console.log("Prompt RPCs are present and reject browser access and nonexistent teachers. No records were created or read.");
          NODE

  test-and-deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        run: node scripts/validate-deploy-env.mjs worker
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          APP_ENV: ${{ vars.APP_ENV }}
          ALLOWED_ORIGINS: ${{ format('{0},https://explain.az,https://www.explain.az', vars.ALLOWED_ORIGINS) }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.145.0"
          command: >-
            deploy
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
            --var SUPABASE_JWKS_URL:${{ vars.SUPABASE_JWKS_URL }}
            --var APP_ENV:${{ vars.APP_ENV }}
            --var TEACHER_PLUGIN_CLIENT_IDS:${{ vars.TEACHER_PLUGIN_CLIENT_IDS }}
            --var ALLOWED_ORIGINS:${{ format('{0},https://explain.az,https://www.explain.az', vars.ALLOWED_ORIGINS) }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY
            PIN_PEPPER
            TEACHER_SETUP_CODE
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          TEACHER_SETUP_CODE: ${{ secrets.TEACHER_SETUP_CODE }}
      - name: Verify deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          FRONTEND_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          node scripts/validate-worker-url.mjs "$WORKER_URL"
          node scripts/validate-worker-url.mjs "$FRONTEND_WORKER_URL"
          if [ "$WORKER_URL" != "$FRONTEND_WORKER_URL" ]; then
            echo "VITE_WORKER_URL does not match the deployed Worker URL."
            exit 1
          fi
          node - <<'NODE'
          const response = await fetch(`${process.env.WORKER_URL}/api/health`);
          const payload = await response.json();
          if (!response.ok || payload?.ok !== true) {
            throw new Error(`Worker health check failed with HTTP ${response.status}`);
          }
          console.log("Worker health check passed.");
          for (const type of ["simulation", "voice", "voice_realtime", "writing"]) {
            const prompts = await fetch(process.env.WORKER_URL + "/api/teacher/ai-prompts?type=" + type);
            if (prompts.status !== 401) throw new Error("Teacher prompts did not require authentication.");
          }
          const promptSave = await fetch(process.env.WORKER_URL + "/api/teacher/ai-prompts/defaults", {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: "simulation", prompts: {}, updatedAt: null })
          });
          if (promptSave.status !== 401) throw new Error("Prompt saves did not require authentication.");
          console.log("Prompt read and write authentication checks passed.");
          const resource = `${process.env.WORKER_URL}/mcp/teacher`;
          const metadataUrl = `${process.env.WORKER_URL}/.well-known/oauth-protected-resource/mcp/teacher`;
          const metadataResponse = await fetch(metadataUrl);
          const metadata = await metadataResponse.json();
          if (!metadataResponse.ok || metadata.resource !== resource ||
              metadata.authorization_servers?.length !== 1 ||
              metadata.authorization_servers[0] !== `${process.env.SUPABASE_URL}/auth/v1` ||
              !["openid", "email", "profile"].every(scope => metadata.scopes_supported?.includes(scope))) {
            throw new Error("Teacher plugin OAuth discovery check failed.");
          }
          const request = {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: {
              protocolVersion: "2025-11-25", capabilities: {}, clientInfo: { name: "release-verification", version: "1.0" }
            } })
          };
          const unauthorized = await fetch(resource, request);
          if (unauthorized.status !== 401 || !unauthorized.headers.get("www-authenticate")?.includes(metadataUrl)) {
            throw new Error("Teacher plugin did not require OAuth authentication.");
          }
          const wrongOrigin = await fetch(resource, { ...request,
            headers: { ...request.headers, Origin: "https://untrusted.example" } });
          if (wrongOrigin.status !== 403) throw new Error("Teacher plugin origin restriction check failed.");
          console.log("Teacher plugin discovery, authentication, and origin checks passed; no account data was read.");
          NODE

  deploy-frontend:
    needs: test-and-deploy
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
