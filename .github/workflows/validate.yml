name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: causalyst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/causalyst_test
      - run: npm run build
      - run: npm run build:plugins
      - run: npm run check:bundle
      - run: npm run security
      - run: npm run audit
      - run: npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build the isolated staging frontend
        run: npm run build --workspace frontend
        env:
          VITE_BASE_PATH: /
          VITE_WORKER_URL: https://staging.explain.az
          VITE_GUEST_API_ORIGIN: https://staging.explain.az
          VITE_SUPABASE_URL: https://nscgqhsfudbnzfayvrnl.supabase.co
          # Dry-run fixture only; deployment requires the project's public key.
          VITE_SUPABASE_ANON_KEY: ci-public-key-not-for-deployment
      - name: Scan the staging frontend
        run: npm run security
      - name: Validate staging assets, routing, bindings and Worker bundle
        run: npm exec --workspace worker -- wrangler deploy --env staging --dry-run --outdir ../.worker-build/staging
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Save browser previews and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Avoid shared-runner download quotas on Supabase's public ECR mirror.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run supabase:start
      - run: npm run db:types
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: worker/src/lib/database.generated.ts
          retention-days: 7
      - run: npm run build:worker
      - run: npm run test:supabase
      - name: Check committed database types
        run: |
          git ls-files --error-unmatch worker/src/lib/database.generated.ts
          git diff --exit-code -- worker/src/lib/database.generated.ts
      - name: Stop disposable Supabase stack
        if: always()
        run: npm run supabase:stop
