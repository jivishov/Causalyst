function gradebookPage(){return `${pageHead("Gradebook",button(icon("download")+"Export demo CSV","export","primary"))}<div class="dark-context"><div><h2>Review first. Publish when ready.</h2><p>Final grades and feedback are released together. Pending responses keep their provisional status.</p></div>${button("Open review queue"+icon("arrow"),"open-review")}</div><div class="table-wrap"><table><caption class="sr-only">Synthetic student grades</caption><thead><tr><th>Student</th><th>Assessment</th><th>Points</th><th>Grade</th><th>Review status</th><th></th></tr></thead><tbody>${state.responses.map(r=>{const t=template(r.template),p=r.points.reduce((a,b)=>a+b,0),max=points(responseRubric(r));return `<tr><td><strong>${esc(r.name)}</strong><small>Demo student</small></td><td>${esc(t?.title||"Assessment")}</td><td>${p} / ${max}</td><td>${r.status==="Published"?Math.round(p/max*100)+"%":'<span class="muted">Not released</span>'}</td><td><span class="pill ${r.status==="Pending"?"coral":"iris"}">${r.status}</span></td><td>${button("Review","review:"+r.id)}</td></tr>`}).join("")}</tbody></table></div>`}
function coursesPage(){return `${pageHead("Courses & roster",button(icon("plus")+"New class","new-course","primary"))}<div class="course-cards">${state.courses.map((c,i)=>`<section class="panel course-card"><div class="panel-head"><span class="class-dot ${i%2?"coral":""}"></span><span class="course-code">${esc(c.code)}</span></div><div class="panel-body"><h2>${esc(c.name)}</h2><div class="course-info"><span>${c.students} demo students</span><span>${state.assignments.filter(a=>a.course===c.id).length} assignments</span></div><p class="small muted">Review the roster or assign a saved assessment to this class.</p><div class="row wrap">${button(icon("users")+"View roster","roster:"+c.id,"soft")}${button(icon("send")+"Assign assessment","assign-course:"+c.id)}</div></div></section>`).join("")}</div>`}
function settingsPage(){return `${pageHead("AI settings",'<span class="pill iris">Demo configuration</span>')}<div class="settings-grid"><section class="panel"><div class="panel-head"><h2>Providers & models</h2></div><div class="provider-row selected"><div><strong>OpenAI</strong><small>Illustrative model configuration</small></div><span class="pill iris">Demo</span></div><div class="panel-body"><p class="small muted">No provider key is used in this offline prototype. Select an assessment to demonstrate the settings students see.</p><label class="field" style="margin-top:14px" for="settings-assessment">Assessment<select id="settings-assessment" aria-label="Assessment">${state.templates.filter(t=>!t.archived).map(t=>`<option value="${t.id}" ${selected===t.id?"selected":""}>${esc(t.title)}</option>`).join("")}</select></label></div></section><section class="panel"><div class="panel-head"><h2>${icon("settings")}Assigned model settings</h2><span class="small muted">${esc(draft.title)}</span></div><div class="panel-body">${modelEditor()}<p id="builder-error" class="error-message" role="alert"></p></div><footer class="builder-foot"><span id="save-message" class="save-message">${dirty?"Unsaved changes":"Saved in this demo"}</span>${button(icon("save")+"Save settings","save","primary")}</footer></section></div>`}
function render(){const active=document.activeElement,id=active?.id,caret=active&&typeof active.selectionStart==="number"?[active.selectionStart,active.selectionEnd]:null;document.getElementById("app").innerHTML=shell();if(id){const e=document.getElementById(id);if(e){e.focus({preventScroll:true});if(caret&&typeof e.setSelectionRange==="function"&&e.type!=="number")try{e.setSelectionRange(...caret)}catch{}}}if(view==="review"&&reviewTab==="model")requestAnimationFrame(drawScience)}
function readRoute(){const route=location.hash.slice(1);view=["assessments","review","gradebook","assignments","courses","settings"].includes(route)?route:"assessments"}
function navigate(next){location.hash=next}
function openDialog(title,body,footer="",subtitle=""){const d=document.getElementById("dialog");d.innerHTML=`<div class="dialog-head"><div><h2 id="dialogTitle">${title}</h2>${subtitle?`<p>${subtitle}</p>`:""}</div><button class="icon-btn" data-action="close-dialog" aria-label="Close dialog">${icon("close")}</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${footer||button("Close","close-dialog")}</div>`;if(!d.open)d.showModal()}
function selectTemplate(id){if(dirty){openDialog("Keep your changes?",'<p>Save your edits before switching assessments, or discard them to open the other assessment.</p>',button("Keep editing","close-dialog")+button("Discard edits","discard:"+id,"soft")+button("Save and continue","save-switch:"+id,"primary"));return}selected=id;draft=clone(template(id));builderTab="prompt";render()}
function validateDraft(){if(!draft.title.trim())return"Give the assessment a title.";if(draft.prompt.trim().length<30)return"Add clear student instructions before saving.";if(!draft.rubric.length||points(draft)<=0)return"Add at least one criterion with points.";if(points(draft)>100)return"Keep the rubric total at 100 points or fewer.";return""}
function saveDraft(show=true){const error=validateDraft();if(error){const e=document.getElementById("builder-error");if(e)e.textContent=error;toast(error);return false}const i=state.templates.findIndex(t=>t.id===selected);if(i>=0)state.templates[i]=clone(draft);else state.templates.unshift(clone(draft));dirty=false;persist();render();if(show)toast("Assessment saved in this demo.");return true}
function assignDialog(courseId=""){if(!saveDraft(false))return;openDialog("Assign to class",`<p><strong>${esc(draft.title)}</strong> will be added to the selected demo class.</p><div class="dialog-grid"><label class="field" for="assign-course">Class<select id="assign-course" aria-label="Class">${state.courses.map(c=>`<option value="${c.id}" ${(courseId||draft.course)===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label class="field" for="assign-due">Due date and time<input type="datetime-local" id="assign-due" aria-label="Due date and time" value="2026-10-09T23:59"></label></div><p class="small muted" style="margin-top:12px">Time is interpreted in your browser's local time zone. This creates a demo assignment.</p><p id="dialog-error" class="error-message" role="alert"></p>`,button("Cancel","close-dialog")+button(icon("send")+"Assign in demo","confirm-assign","primary"))}
function drawScience(){const canvas=document.getElementById("science-preview");if(!canvas)return;const w=canvas.clientWidth,h=canvas.clientHeight,ratio=devicePixelRatio||1;canvas.width=w*ratio;canvas.height=h*ratio;const c=canvas.getContext("2d");c.scale(ratio,ratio);const l=35,b=h-35,top=35,pw=w-50,ph=b-top;c.lineWidth=1;c.strokeStyle="#e4deef";for(let i=0;i<4;i++){let y=top+i*ph/3;c.beginPath();c.moveTo(l,y);c.lineTo(w-15,y);c.stroke()}const peaks=[["1s",2,.15],["2s",2,.45],["2p",6,.65],["3s",1,.88]];for(const[name,n,pos]of peaks){const x=l+pw*pos,sigma=pw*.027,height=ph*n/7;c.beginPath();c.moveTo(x-4*sigma,b);for(let dx=-4*sigma;dx<=4*sigma;dx+=sigma/14)c.lineTo(x+dx,b-height*Math.exp(-.5*(dx/sigma)**2));c.lineTo(x+4*sigma,b);c.fillStyle=name==="2p"?"#8a71dc38":"#b0a0d92b";c.fill();c.strokeStyle=name==="2p"?"#6650bd":"#9e8cbd";c.lineWidth=name==="2p"?2.4:1.7;c.stroke();c.fillStyle="#6d6082";c.font="600 11px Segoe UI,Arial";c.textAlign="center";c.fillText(name,x,b-height-13);c.font="10px Segoe UI,Arial";c.fillText(n+" e⁻",x,b-height-1)}c.fillStyle="#6c6081";c.font="10px Segoe UI,Arial";c.textAlign="left";c.fillText("Higher binding energy",l,h-8);c.textAlign="right";c.fillText("Lower binding energy",w-15,h-8)}
function action(a){
if(a==="close-dialog"){document.getElementById("dialog").close();return}
if(a==="demo"){openDialog("Explore the teacher demo",'<button class="dialog-option" data-action="download-file">'+icon("download")+'<span>Download the HTML mockup<small>A single file you can open offline.</small></span></button><button class="dialog-option" data-action="open-review">'+icon("review")+'<span>Review a student response<small>Check the explanation, rubric and feedback.</small></span></button><button class="dialog-option" data-action="open-library">'+icon("clipboard")+'<span>Edit an assessment<small>Try the Prompt, Rubric and Models tabs.</small></span></button><button class="dialog-option" data-action="reset">'+icon("archive")+'<span>Reset demo data<small>Restore the original sample assessments and reviews.</small></span></button>',button("Close","close-dialog"));return}
if(a==="download-file"){const blob=new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="Causalyst_Teacher_UI_Demo.html";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Teacher HTML mockup downloaded.");return}
if(a==="help"){openDialog("A classroom workflow, in one place",'<p>Create a clear assessment, assign it to a class, review the student’s explanation and evidence, then publish your feedback.</p><p>This standalone mockup uses synthetic records. Edits, assignments and reviews are saved only in this browser; no real students, grades, AI calls or provider keys are involved.</p>');return}
if(a==="reset"){openDialog("Reset this demo?",'<p>This will restore the sample records and remove edits made in this teacher mockup.</p>',button("Keep my changes","close-dialog")+button("Reset demo","confirm-reset","primary"));return}
if(a==="confirm-reset"){state=seed();selected="atomic";draft=clone(template(selected));dirty=false;selectedResponse="r1";reviewDraft=null;reviewDrafts={};for(const r of state.responses)r.rubric=clone(template(r.template)?.rubric||[]);persist();document.getElementById("dialog").close();navigate("assessments");readRoute();render();toast("Demo reset.");return}
if(a==="new"||a==="duplicate"){if(dirty){toast("Save your changes before creating another assessment.");return}draft=clone(a==="duplicate"?draft:seed().templates[0]);draft.id="template-"+Date.now();draft.title=a==="duplicate"?draft.title+" — copy":"New assessment";draft.prompt=a==="new"?"":draft.prompt;draft.assigned=false;draft.archived=false;selected=draft.id;dirty=true;builderTab="prompt";render();document.getElementById("assessment-title")?.focus();return}
if(a==="save"){saveDraft();return}
if(a.startsWith("discard:")){dirty=false;document.getElementById("dialog").close();selectTemplate(a.slice(8));return}
if(a.startsWith("save-switch:")){const id=a.slice(12);if(saveDraft(false)){document.getElementById("dialog").close();selectTemplate(id)}return}
if(a==="archive"){if(!template(selected)){toast("Save this assessment before archiving it.");return}draft.archived=!draft.archived;saveDraft(false);libraryFilter=draft.archived?"archived":"all";render();toast(draft.archived?"Assessment archived in this demo.":"Assessment restored.");return}
if(a==="models-tab"){builderTab="models";render();return}
if(a==="preview"){openDialog("Student preview",`<span class="pill iris">${esc(draft.type)}</span><h3 class="preview-title" style="margin-top:10px">${esc(draft.title)}</h3><div class="preview-prompt">${esc(draft.prompt)||"Add student instructions in the builder."}</div><p class="small muted">${esc(draft.model)} · ${esc(draft.reasoning)} reasoning · Fast ${draft.fast?"on":"off"}</p><h3>Success criteria</h3><div class="review-scores">${draft.rubric.map(r=>`<div class="score-row"><span>${esc(r.name)}</span><strong>${r.points} points</strong></div>`).join("")}</div>`,button("Close preview","close-dialog"),"Preview the current draft before assigning it.");return}
if(a==="assign"||a==="assign-from-list"){assignDialog();return}
if(a.startsWith("assign-course:")){assignDialog(a.slice(13));return}
if(a==="confirm-assign"){const due=document.getElementById("assign-due").value,id=document.getElementById("assign-course").value;if(!due||!Number.isFinite(Date.parse(due))){document.getElementById("dialog-error").textContent="Choose a valid due date and time.";return}state.assignments.push({id:"assignment-"+Date.now(),template:selected,course:id,due,created:new Date().toISOString()});draft.assigned=true;const t=template(selected);if(t)t.assigned=true;persist();document.getElementById("dialog").close();navigate("assignments");readRoute();render();toast("Assignment created in the demo class.");return}
if(a.startsWith("assignment:")){const x=state.assignments.find(x=>x.id===a.slice(11));if(x)openDialog("Assignment details",`<p><strong>${esc(template(x.template)?.title)}</strong></p><p>${esc(course(x.course).name)} · ${course(x.course).students} demo students</p><p>Due ${new Date(x.due).toLocaleString()}</p><span class="pill iris">Assigned in demo</span>`);return}
if(a==="open-library"||a==="open-review"){document.getElementById("dialog").close();navigate(a==="open-review"?"review":"assessments");readRoute();render();return}
if(a.startsWith("review:")){if(reviewDraft)reviewDrafts[reviewDraft.id]=clone(reviewDraft);selectedResponse=a.slice(7);reviewDraft=null;navigate("review");readRoute();render();return}
if(a==="save-review"){const r=response();Object.assign(r,clone(reviewDraft));if(r.status!=="Published")r.status="Reviewed";reviewDraft.status=r.status;reviewDrafts[r.id]=clone(reviewDraft);persist();render();toast("Review saved in this demo.");return}
if(a==="publish"){const r=reviewDraft,max=points(responseRubric(r)),sum=r.points.reduce((a,b)=>a+b,0);if(!r.feedback.trim()){toast("Add feedback before publishing.");return}openDialog("Publish feedback?",`<p><strong>${esc(r.name)}</strong> will see ${sum} / ${max} points and your feedback in this demo.</p><div class="preview-prompt">${esc(r.feedback)}</div><p class="small muted">This releases a synthetic grade. No real student account is changed.</p>`,button("Keep reviewing","close-dialog")+button(icon("send")+"Publish in demo","confirm-publish","primary"));return}
if(a==="confirm-publish"){Object.assign(response(),clone(reviewDraft),{status:"Published"});reviewDraft.status="Published";reviewDrafts[reviewDraft.id]=clone(reviewDraft);persist();document.getElementById("dialog").close();render();toast("Feedback published in this demo.");return}
if(a==="export"){const quote=v=>'"'+String(v??"").replaceAll('"','""')+'"';const rows=[["Student","Assessment","Points","Maximum points","Review status","Released grade"],...state.responses.map(r=>{const t=template(r.template),sum=r.points.reduce((a,b)=>a+b,0),max=points(responseRubric(r));return[r.name,t?.title,sum,max,r.status,r.status==="Published"?Math.round(sum/max*100):"Not released"]})];const blob=new Blob([rows.map(r=>r.map(quote).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="Causalyst_Demo_Gradebook.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Demo gradebook exported.");return}
if(a==="new-course"){openDialog("Create a demo class",'<div class="dialog-grid"><label class="field" for="course-name">Class name<input id="course-name" aria-label="Class name" placeholder="Honors Chemistry"></label><label class="field" for="course-code">Class code<input id="course-code" aria-label="Class code" placeholder="HONCHEM-2627"></label></div><p id="dialog-error" class="error-message" role="alert"></p>',button("Cancel","close-dialog")+button("Create class","confirm-course","primary"));return}
if(a==="confirm-course"){const name=document.getElementById("course-name").value.trim(),code=document.getElementById("course-code").value.trim();if(!name||!code){document.getElementById("dialog-error").textContent="Add a class name and code.";return}state.courses.push({id:"course-"+Date.now(),name,code,students:0});persist();document.getElementById("dialog").close();render();toast("Demo class created.");return}
if(a.startsWith("roster:")){const c=course(a.slice(7));openDialog("Class roster",`<p>${esc(c.name)} · ${esc(c.code)} · ${c.students} demo students</p><p class="small muted">Sample of the synthetic roster shown in this design.</p><table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>${state.responses.filter(r=>template(r.template)?.course===c.id).map(r=>`<tr><td>${esc(r.name)}</td><td><span class="pill iris">Enrolled in demo</span></td></tr>`).join("")||'<tr><td colspan="2">No demo students yet.</td></tr>'}</tbody></table>`);return}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action],[data-template],[data-builder-tab],[data-filter],[data-response],[data-review-tab]");if(!b)return;if(b.dataset.action)action(b.dataset.action);else if(b.dataset.template)selectTemplate(b.dataset.template);else if(b.dataset.builderTab){builderTab=b.dataset.builderTab;render()}else if(b.dataset.filter){libraryFilter=b.dataset.filter;render()}else if(b.dataset.response){if(reviewDraft)reviewDrafts[reviewDraft.id]=clone(reviewDraft);selectedResponse=b.dataset.response;reviewDraft=null;render()}else if(b.dataset.reviewTab){reviewTab=b.dataset.reviewTab;render()}});
document.addEventListener("input",e=>{const x=e.target;if(x.id==="library-search"){query=x.value;render();return}if(x.dataset.field){draft[x.dataset.field]=x.type==="checkbox"?x.checked:x.value;dirty=true;if(x.id==="assessment-prompt"){document.getElementById("prompt-count").textContent=draft.prompt.length+" characters"}const mp=document.getElementById("model-summary-preview");if(mp)mp.textContent=draft.model+" · "+draft.reasoning+" reasoning · Fast "+(draft.fast?"on":"off")}if(x.dataset.rubricName!==undefined){draft.rubric[Number(x.dataset.rubricName)].name=x.value;dirty=true}if(x.dataset.rubricDescription!==undefined){draft.rubric[Number(x.dataset.rubricDescription)].description=x.value;dirty=true}if(x.dataset.rubricPoints!==undefined){draft.rubric[Number(x.dataset.rubricPoints)].points=Math.max(0,Math.min(50,Number(x.value)||0));dirty=true;document.getElementById("rubric-total").textContent=points(draft)+" points"}if(x.dataset.score!==undefined){const i=Number(x.dataset.score),max=responseRubric(reviewDraft).rubric[i].points;reviewDraft.points[i]=Math.max(0,Math.min(max,Number(x.value)||0));document.getElementById("review-total").textContent=reviewDraft.points.reduce((a,b)=>a+b,0)+" / "+points(responseRubric(reviewDraft))+" Teacher review"}if(x.id==="teacher-feedback")reviewDraft.feedback=x.value;if(dirty){const save=document.getElementById("save-message");if(save)save.textContent="Unsaved changes"}});
document.addEventListener("change",e=>{const x=e.target;if(x.id==="type-filter"){typeFilter=x.value;render()}if(x.id==="settings-assessment")selectTemplate(x.value)});
document.getElementById("dialog").addEventListener("click",e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
window.addEventListener("hashchange",()=>{readRoute();render();window.scrollTo(0,0)});
window.addEventListener("resize",()=>{if(view==="review"&&reviewTab==="model")drawScience()});
readRoute();render();
</script>
</body>
</html>
